<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="370" viewBox="0 0 1200 370" role="img" aria-labelledby="title desc">
<title id="title">Badal Ahire — DevOps Engineer</title><desc id="desc">Burgundy technical banner with orbital linework and a glowing animated pipeline.</desc>
<defs>
 <linearGradient id="cloudyBg" x1="0" x2="1" y2="1"><stop stop-color="#10070C"/><stop offset=".55" stop-color="#190B12"/><stop offset="1" stop-color="#451126"/></linearGradient>
 <linearGradient id="cloudyRose" x1="0" x2="1"><stop stop-color="#701A3D"/><stop offset=".5" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B"/></linearGradient>
 <pattern id="cloudyGrid" width="35" height="35" patternUnits="userSpaceOnUse"><path d="M35 0H0V35" fill="none" stroke="#C77B9B" stroke-opacity=".10" stroke-width=".7"/></pattern>
 <filter id="cloudyGlow" x="-30%" y="-300%" width="160%" height="700%"><feGaussianBlur stdDeviation="5"/></filter>
 <clipPath id="cloudyClip"><rect width="1200" height="370" rx="22"/></clipPath>
</defs>
<g clip-path="url(#cloudyClip)"><rect width="1200" height="370" fill="url(#cloudyBg)"/><rect width="1200" height="370" fill="url(#cloudyGrid)"/>
<circle cx="1010" cy="180" r="170" fill="none" stroke="#C77B9B" stroke-opacity=".28"/><circle cx="1010" cy="180" r="122" fill="none" stroke="#E5B5C7" stroke-opacity=".19" stroke-dasharray="4 12"><animateTransform attributeName="transform" type="rotate" from="0 1010 180" to="360 1010 180" dur="65s" repeatCount="indefinite"/></circle>
<ellipse cx="1010" cy="180" rx="195" ry="65" transform="rotate(-27 1010 180)" fill="none" stroke="#C77B9B" stroke-opacity=".4"/>
<circle cx="1010" cy="180" r="9" fill="#E5B5C7"/><circle cx="1010" cy="180" r="30" fill="none" stroke="#C77B9B" stroke-opacity=".45"/>
<path d="M850 250 L905 215 L957 233 L1010 180 L1070 142 L1140 162" fill="none" stroke="url(#cloudyRose)" stroke-width="2" stroke-dasharray="8 10"><animate attributeName="stroke-dashoffset" from="0" to="-72" dur="9s" repeatCount="indefinite"/></path>
<text x="76" y="90" fill="#C77B9B" font-family="Arial, sans-serif" font-size="17" letter-spacing="5">CLOUD-SKYLARK  /  DEVOPS</text>
<text x="72" y="185" fill="#F8F0F3" font-family="Arial, sans-serif" font-weight="bold" font-size="73">BADAL AHIRE</text>
<text x="77" y="235" fill="#E5B5C7" font-family="Arial, sans-serif" font-size="24" letter-spacing="2">DEVOPS ENGINEER  ·  CLOUD &amp; AUTOMATION</text>
<path d="M77 265 H700" stroke="#701A3D" stroke-width="7" stroke-linecap="round" filter="url(#cloudyGlow)"/><path d="M77 265 H700" stroke="url(#cloudyRose)" stroke-width="3" stroke-linecap="round" stroke-dasharray="110 15"><animate attributeName="stroke-dashoffset" values="0;-125" dur="7s" repeatCount="indefinite"/></path>
<text x="78" y="316" fill="#C77B9B" font-family="monospace" font-size="17">git push  →  build  →  containerize  →  deploy</text>
</g></svg>
